const events=[
{date:'c. 8000–3200 BCE',short:'First communities',title:'The first communities',tag:'ORIGINS',desc:'People settled on the island after the last Ice Age. Farming later changed daily life; around 3200 BCE communities built the passage tomb at Newgrange.',q:'What can a monument tell us about people who left no written records?',source:'Heritage Ireland · Early Ireland',url:'https://heritageireland.ie/articles/mesolithic-iron-age-8000bc-400ad/',icon:'stone'},
{date:'5th–6th centuries',short:'Christianity',title:'Belief, books & memory',tag:'EARLY IRELAND',desc:'Christianity spread through Ireland. Monasteries became important centers of learning and manuscript culture, alongside older traditions.',q:'How can a new belief change the way a culture preserves its stories?',source:'Heritage Ireland · Monasteries and abbeys',url:'https://heritageireland.ie/visit/monasteries-and-abbeys/',icon:'book'},
{date:'795–10th century',short:'Viking Ireland',title:'Raiders, traders, towns',tag:'CONNECTIONS',desc:'Viking raids began in 795. Later, fortified bases developed into towns, including Dublin, and trade connected Ireland to wider networks.',q:'How can the same arrivals bring violence and lasting exchange?',source:'National Museum of Ireland · The Viking Age',url:'https://source.museum.ie/en-IE/Collections-Research/Irish-Antiquities-Division-Collections/Collections-List-%281%29/Viking/The-Viking-Age-in-Ireland',icon:'ship'},
{date:'1169 onward',short:'Norman arrival',title:'A new power arrives',tag:'POWER & LAND',desc:'Norman forces arrived in 1169. Their involvement began a long, uneven history of English influence and control; authority was never uniform across the whole island.',q:'Who gains power when political control over land changes?',source:'National Museum of Ireland · Vikings and Normans',url:'https://source.museum.ie/en-IE/Collections-Research/Art-and-Industry-Collections/Art-Industry-Collections-List/Numismatics/Airgead-A-Thousand-Years-of-Irish-Coins-Currency/950-1450-Vikings%2C-Normans-and-Medieval-Mints',icon:'tower'},
{date:'16th–17th centuries',short:'Conquest & plantations',title:'Land, religion & power',tag:'POWER & LAND',desc:'English conquest and plantations transferred land to settlers, including Protestants from England and Scotland. These changes contributed to deep political, economic and religious divisions.',q:'How might changes in land ownership shape identity across generations?',source:'National Archives · Ireland chronology',url:'https://csorp.nationalarchives.ie/context/chronology.html',icon:'land'},
{date:'1801–1829',short:'Union & rights',title:'Union and unequal rights',tag:'POLITICS',desc:'The Act of Union brought Ireland into the United Kingdom in 1801. Catholic emancipation in 1829 removed major barriers to Catholics entering Parliament.',q:'What is the difference between being governed and having political representation?',source:'UK Parliament · Union and emancipation',url:'https://www.parliament.uk/about/living-heritage/evolutionofparliament/legislativescrutiny/parliamentandireland/overview/repeal/',icon:'columns'},
{date:'1845–1852',short:'The Great Famine',title:'Famine & departure',tag:'MIGRATION',desc:'Potato blight struck a society already marked by poverty and unequal access to land. Around a million people died and roughly another million emigrated; government responses remain a subject of debate.',q:'Why does a crop failure become a human catastrophe?',source:'National Archives of Ireland · Famine records',url:'https://nationalarchives.ie/help-with-research/research-guides/famine-records-distress-papers-and-the-relief-commission/',icon:'ship'},
{date:'1914–1916',short:'Home Rule & Rising',title:'A demand for change',tag:'INDEPENDENCE',desc:'Home Rule was passed in 1914 but suspended during World War I. In 1916 rebels launched the Easter Rising, mainly in Dublin. The executions that followed helped shift public opinion.',q:'Why can the response to a rebellion change its meaning?',source:'National Archives · 1916 and the revolution',url:'https://centenaries.nationalarchives.ie/centenaries/',icon:'flag'},
{date:'1919–1923',short:'War & partition',title:'Independence and division',tag:'INDEPENDENCE',desc:'The War of Independence ended in a 1921 treaty. Ireland had already been partitioned; the Irish Free State began in 1922 while Northern Ireland remained in the UK. A civil war followed in the new state.',q:'Why did independence produce different outcomes on one island?',source:'UK Parliament · The Anglo-Irish Treaty',url:'https://commonslibrary.parliament.uk/research-briefings/cbp-9260/',icon:'land'},
{date:'1948–1949',short:'Republic of Ireland',title:'A republic emerges',tag:'A CHANGING STATE',desc:'The Republic of Ireland Act was passed in 1948 and took effect in 1949. Northern Ireland remained part of the United Kingdom.',q:'How do legal changes give a state a new identity?',source:'Irish Statute Book · Republic of Ireland Act',url:'https://www.irishstatutebook.ie/eli/1948/act/22/enacted/en/html',icon:'columns'},
{date:'late 1960s–1998',short:'The Troubles',title:'Conflict in Northern Ireland',tag:'CONFLICT & PEACE',desc:'The Troubles involved political conflict, discrimination, violence by paramilitaries and state forces, and suffering across communities. Religious labels alone cannot explain the conflict.',q:'Whose experiences need to be heard to understand a divided society?',source:'UK National Archives · The Belfast Agreement',url:'https://www.nationalarchives.gov.uk/education/teaching-resources/the-belfast-good-friday-agreement/',song:'U2 · Sunday Bloody Sunday',songurl:'https://www.youtube.com/watch?v=zhMD7nt1LIg',icon:'bridge'},
{date:'1973–1990s',short:'Europe & economy',title:'New connections',tag:'EUROPE & CHANGE',desc:'Ireland joined the European Economic Community in 1973. In the 1990s the Republic experienced rapid economic growth, later known as the Celtic Tiger.',q:'How might economic opportunity change migration and identity?',source:'EU · History of the European Union',url:'https://european-union.europa.eu/principles-countries-history/history-eu/1970-79_en',icon:'stars'},
{date:'10 April 1998',short:'Good Friday Agreement',title:'Building a peace',tag:'CONFLICT & PEACE',desc:'The Belfast / Good Friday Agreement created a framework for power-sharing and cooperation. It affirmed that Northern Ireland’s constitutional status depends on majority consent. Peace remains an ongoing process.',q:'What does a peace agreement need in order to last?',source:'UK National Archives · The agreement',url:'https://www.nationalarchives.gov.uk/image/2e914784-65f4-40ea-972d-65ec5bce6119/',icon:'bridge'}
];

let active=0;const $=id=>document.getElementById(id),rail=$('rail');function show(i){active=Math.max(0,Math.min(events.length-1,i));let e=events[active];$('tag').textContent=e.tag;$('date').textContent=e.date;$('title').textContent=e.title;$('description').textContent=e.desc;$('question').textContent=e.q;$('artlabel').textContent=e.tag+' · IRELAND';$('symbol').innerHTML=icons[e.icon];$('links').innerHTML=`<a target="_blank" rel="noopener noreferrer" href="${e.url}">Explore source: ${e.source}</a>${e.song?`<a class="secondary" target="_blank" rel="noopener noreferrer" href="${e.songurl}">Listen: ${e.song}</a>`:''}`;[...rail.children].forEach((b,j)=>b.setAttribute('aria-current',j===active?'true':'false'));rail.children[active].scrollIntoView({block:'nearest',inline:'nearest'});$('prev').disabled=active===0;$('next').disabled=active===events.length-1}events.forEach((e,i)=>{let b=document.createElement('button');b.className='point';b.innerHTML=`<strong>${e.date}</strong><span>${e.short}</span>`;b.onclick=()=>show(i);rail.append(b)});$('prev').onclick=()=>show(active-1);$('next').onclick=()=>show(active+1);$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else alert('Use landscape orientation and hide the browser controls for the largest view.')}catch{alert('Fullscreen is unavailable in this browser. Use landscape orientation for the largest view.')}};
$('export').onclick=()=>{let c=document.createElement('canvas');c.width=4800;c.height=2700;let x=c.getContext('2d');x.fillStyle='#102b30';x.fillRect(0,0,4800,2700);x.fillStyle='#d6bd81';x.font='bold 48px Arial';x.fillText('IRELAND  /  THE PAST IN THE PRESENT',180,180);x.fillStyle='#f6f5eb';x.font='150px Georgia';x.fillText('A history of turning points',180,360);x.fillStyle='#a9c5ba';x.font='44px Arial';x.fillText('From first communities to the Good Friday Agreement  ·  dates are not to scale',180,450);let cols=4,w=1080,h=530;events.forEach((e,i)=>{let col=i%cols,row=Math.floor(i/cols),px=180+col*1120,py=570+row*500;x.fillStyle='#264740';x.fillRect(px,py,w,450);x.fillStyle='#d6bd81';x.font='bold 38px Arial';x.fillText(e.date,px+35,py+65);x.fillStyle='#fff';x.font='bold 47px Arial';wrap(x,e.short,px+35,py+135,w-70,53,2);x.fillStyle='#cddfd4';x.font='34px Arial';wrap(x,e.desc,px+35,py+210,w-70,43,5)});x.fillStyle='#a9c5ba';x.font='34px Arial';x.fillText('Based on A Brief History of Ireland · Explore sources in the interactive timeline',180,2635);c.toBlob(async blob=>{let b=new Uint8Array(await blob.arrayBuffer());for(let i=2;i<b.length-16;i++){if(b[i]===0x4a&&b[i+1]===0x46&&b[i+2]===0x49&&b[i+3]===0x46&&b[i+4]===0){b[i+7]=1;b[i+8]=1;b[i+9]=44;b[i+10]=1;b[i+11]=44;break}}let u=URL.createObjectURL(new Blob([b],{type:'image/jpeg'})),a=document.createElement('a');a.href=u;a.download='ireland-history-timeline-300dpi.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(u),60000)},'image/jpeg',.94)};function wrap(ctx,text,x,y,max,line,limit){let words=text.split(' '),s='',n=0;for(let word of words){let next=s? s+' '+word:word;if(ctx.measureText(next).width>max&&s){ctx.fillText(s,x,y+n*line);n++;s=word;if(n>=limit)return}else s=next}if(s&&n<limit)ctx.fillText(s,x,y+n*line)}show(0);
</script></body></html>
